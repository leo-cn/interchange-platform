<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: commonHead('定时任务列表')}"></head>
<body>
<div class="layout">
    <div th:replace="~{fragments/layout :: sidebar('task')}"></div>

    <div class="main">
        <div th:replace="~{fragments/layout :: topbar('定时任务列表')}"></div>

        <div class="content">
            <!-- 筛选 -->
            <div class="card">
                <div class="card-body">
                    <form id="filterForm" method="get" th:action="@{/task/list}">
                        <div class="filter-bar">
                            <div class="field wide">
                                <label>关键字（任务编码 / 名称）</label>
                                <input type="text" name="keyword" th:value="${keyword}" placeholder="模糊匹配">
                            </div>
                            <div class="field">
                                <label>第三方系统</label>
                                <select name="partnerId">
                                    <option value="">全部</option>
                                    <option th:each="p : ${partners}" th:value="${p.id}"
                                            th:text="${p.partnerName}"
                                            th:selected="${partnerId != null and partnerId == p.id}"></option>
                                </select>
                            </div>
                            <div class="field">
                                <label>状态</label>
                                <select name="enabled">
                                    <option value="">全部</option>
                                    <option value="true" th:selected="${enabled != null and enabled}">已启用</option>
                                    <option value="false" th:selected="${enabled != null and !enabled}">已停用</option>
                                </select>
                            </div>
                            <div class="field" style="flex:0 0 auto;">
                                <button class="btn btn-primary" type="submit">查询</button>
                                <a class="btn" th:href="@{/task/list}">重置</a>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <div class="card">
                <div class="card-head">
                    <span>任务清单</span>
                    <div class="actions">
                        <a class="btn btn-sm btn-primary" th:href="@{/task/edit}">＋ 新建任务</a>
                    </div>
                </div>
                <div class="card-body tight">
                    <table>
                        <thead>
                        <tr>
                            <th>任务编码</th>
                            <th>任务名称</th>
                            <th>数据来源</th>
                            <th>目标系统</th>
                            <th>目标路径</th>
                            <th>推送模式</th>
                            <th>Cron</th>
                            <th>状态</th>
                            <th>最近执行</th>
                            <th>结果</th>
                            <th class="nowrap">操作</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${page.totalElements == 0}">
                            <td colspan="11" class="empty">没有符合条件的任务</td>
                        </tr>
                        <tr th:each="task : ${page.content}">
                            <td class="mono" th:text="${task.taskCode}">CODE</td>
                            <td>
                                <div th:text="${task.taskName}">名称</div>
                                <div class="text-sub" style="font-size:12px;" th:text="${task.remark}"></div>
                            </td>
                            <td>
                                <span class="badge badge-info" th:text="${task.sourceType}">SQL</span>
                                <div class="text-sub mono" style="font-size:11.5px;"
                                     th:if="${task.sourceType == 'SQL'}"
                                     th:text="${task.datasourceKey}">main</div>
                            </td>
                            <td>
                                <span th:each="p : ${partners}" th:if="${p.id == task.partnerId}"
                                      th:text="${p.partnerName}">第三方</span>
                            </td>
                            <td class="mono" th:text="${task.targetPath}">/path</td>
                            <td>
                                <span class="badge badge-gray"
                                      th:text="${task.pushMode == 'PER_ROW' ? '逐条' : '整批'}">整批</span>
                            </td>
                            <td class="mono" th:text="${task.cronExpression}">cron</td>
                            <td>
                                <span th:if="${task.enabled}" class="badge badge-success">已启用</span>
                                <span th:unless="${task.enabled}" class="badge badge-gray">已停用</span>
                            </td>
                            <td class="mono"
                                th:text="${task.lastExecTime == null ? '-' : #temporals.format(task.lastExecTime, 'yyyy-MM-dd HH:mm:ss')}">-</td>
                            <td>
                                <span th:if="${task.lastResult == 'SUCCESS'}" class="badge badge-success">成功</span>
                                <span th:if="${task.lastResult == 'FAIL'}" class="badge badge-fail">失败</span>
                                <span th:if="${task.lastResult == 'PARTIAL'}" class="badge badge-partial">部分成功</span>
                                <span th:if="${task.lastResult == null}" class="badge badge-gray">未执行</span>
                            </td>
                            <td class="nowrap">
                                <button class="btn-link" type="button" th:attr="onclick=|runTask(${task.id})|">执行</button>
                                <button class="btn-link" type="button"
                                        th:attr="onclick=|toggleTask(${task.id}, ${!task.enabled})|"
                                        th:text="${task.enabled} ? '停用' : '启用'">启用</button>
                                <a class="btn-link" th:href="@{/task/edit(id=${task.id})}">配置</a>
                                <a class="btn-link" th:href="@{/log/list(taskCode=${task.taskCode})}">日志</a>
                                <button class="btn-link danger" type="button"
                                        th:attr="onclick=|deleteTask(${task.id}, '${task.taskCode}')|">删除</button>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <!-- 分页 -->
                <div class="pager">
                    <span>共 <b th:text="${page.totalElements}">0</b> 条，第
                        <b th:text="${page.number + 1}">1</b> /
                        <b th:text="${page.totalPages == 0 ? 1 : page.totalPages}">1</b> 页</span>
                    <span class="spacer"></span>
                    <a class="btn btn-sm" th:if="${page.number > 0}"
                       th:href="@{/task/list(page=${page.number}, size=${page.size}, keyword=${keyword}, partnerId=${partnerId}, enabled=${enabled})}">上一页</a>
                    <a class="btn btn-sm" th:if="${page.number + 1 < page.totalPages}"
                       th:href="@{/task/list(page=${page.number + 2}, size=${page.size}, keyword=${keyword}, partnerId=${partnerId}, enabled=${enabled})}">下一页</a>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: modal}"></div>
<script th:src="@{/js/app.js}"></script>
<script>
    async function runTask(id) {
        if (!confirm('确认立即执行该任务？结果请到执行日志页查看。')) return;
        const r = await postForm('/api/task/run', {id: id});
        toast(r.message, r.code === 0 ? 'success' : 'error');
    }

    async function toggleTask(id, enabled) {
        const r = await postForm('/api/task/toggle', {id: id, enabled: enabled});
        toast(r.message, r.code === 0 ? 'success' : 'error');
        if (r.code === 0) setTimeout(() => location.reload(), 700);
    }

    async function deleteTask(id, code) {
        if (!confirm('确认删除任务【' + code + '】？该任务的历史执行日志也会一并删除，此操作不可恢复。')) return;
        const r = await postForm('/api/task/delete', {id: id});
        toast(r.message, r.code === 0 ? 'success' : 'error');
        if (r.code === 0) setTimeout(() => location.reload(), 700);
    }
</script>
</body>
</html>
