<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: commonHead('执行日志查询')}"></head>
<body>
<div class="layout">
    <div th:replace="~{fragments/layout :: sidebar('log')}"></div>

    <div class="main">
        <div th:replace="~{fragments/layout :: topbar('执行日志查询')}"></div>

        <div class="content">
            <div class="card">
                <div class="card-body">
                    <form id="filterForm" method="get" th:action="@{/log/list}">
                        <div class="filter-bar">
                            <div class="field">
                                <label>任务</label>
                                <select name="taskCode">
                                    <option value="">全部任务</option>
                                    <option th:each="t : ${taskOptions}" th:value="${t.taskCode}"
                                            th:text="|${t.taskCode} · ${t.taskName}|"
                                            th:selected="${taskCode == t.taskCode}"></option>
                                </select>
                            </div>
                            <div class="field">
                                <label>执行结果</label>
                                <select name="status">
                                    <option value="">全部</option>
                                    <option value="SUCCESS" th:selected="${status == 'SUCCESS'}">成功</option>
                                    <option value="FAIL" th:selected="${status == 'FAIL'}">失败</option>
                                    <option value="PARTIAL" th:selected="${status == 'PARTIAL'}">部分成功</option>
                                </select>
                            </div>
                            <div class="field">
                                <label>触发方式</label>
                                <select name="triggerType">
                                    <option value="">全部</option>
                                    <option value="CRON" th:selected="${triggerType == 'CRON'}">定时触发</option>
                                    <option value="MANUAL" th:selected="${triggerType == 'MANUAL'}">手工触发</option>
                                </select>
                            </div>
                            <div class="field">
                                <label>开始时间</label>
                                <input type="datetime-local" name="startTime" th:value="${startTime}">
                            </div>
                            <div class="field">
                                <label>结束时间</label>
                                <input type="datetime-local" name="endTime" th:value="${endTime}">
                            </div>
                            <div class="field wide">
                                <label>关键字（traceId / 报文 / 错误信息）</label>
                                <input type="text" name="keyword" th:value="${keyword}" placeholder="模糊匹配">
                            </div>
                            <div class="field" style="flex:0 0 auto;">
                                <button class="btn btn-primary" type="submit">查询</button>
                                <a class="btn" th:href="@{/log/list}">重置</a>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <div class="card">
                <div class="card-head">
                    <span>推送执行日志（共 <b th:text="${page.totalElements}">0</b> 条）</span>
                    <span th:if="${keepLatestOnly}" class="badge badge-gray"
                          title="日志表只保留每个任务的最后一次执行结果（成功失败都覆盖），历史明细请到「接口日志」按文件查看">
                        每个任务只留最后一次
                    </span>
                    <div class="actions">
                        <button class="btn btn-sm" type="button"
                                onclick="downloadWithFilter('filterForm', '/api/log/download', 'txt')">
                            下载 TXT
                        </button>
                        <button class="btn btn-sm" type="button"
                                onclick="downloadWithFilter('filterForm', '/api/log/download', 'csv')">
                            下载 CSV
                        </button>
                    </div>
                </div>
                <div class="card-body tight">
                    <table>
                        <thead>
                        <tr>
                            <th class="nowrap">开始时间</th>
                            <th>任务</th>
                            <th>第三方</th>
                            <th>触发</th>
                            <th>结果</th>
                            <th>条数</th>
                            <th>成功/失败</th>
                            <th>耗时</th>
                            <th>traceId</th>
                            <th class="nowrap">操作</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${page.totalElements == 0}">
                            <td colspan="10" class="empty">没有符合条件的日志</td>
                        </tr>
                        <tr th:each="log : ${page.content}">
                            <td class="mono nowrap"
                                th:text="${log.startTime == null ? '-' : #temporals.format(log.startTime, 'yyyy-MM-dd HH:mm:ss')}">-</td>
                            <td>
                                <div th:text="${log.taskName}">任务</div>
                                <div class="mono text-sub" style="font-size:11.5px;" th:text="${log.taskCode}">code</div>
                            </td>
                            <td th:text="${log.partnerName}">第三方</td>
                            <td>
                                <span class="badge badge-gray"
                                      th:text="${log.triggerType == 'MANUAL' ? '手工' : '定时'}">定时</span>
                            </td>
                            <td>
                                <span th:if="${log.status == 'SUCCESS'}" class="badge badge-success">成功</span>
                                <span th:if="${log.status == 'FAIL'}" class="badge badge-fail">失败</span>
                                <span th:if="${log.status == 'PARTIAL'}" class="badge badge-partial">部分成功</span>
                            </td>
                            <td th:text="${log.totalCount}">0</td>
                            <td>
                                <span th:text="${log.successCount}" style="color:#16a34a;">0</span> /
                                <span th:text="${log.failCount}" style="color:#dc2626;">0</span>
                            </td>
                            <td class="nowrap" th:text="${log.costMs + ' ms'}">0</td>
                            <td class="mono text-sub" style="font-size:11.5px;" th:text="${log.traceId}">-</td>
                            <td class="nowrap">
                                <button class="btn-link" type="button"
                                        th:attr="onclick=|showTaskLogDetail(${log.id})|">详情</button>
                                <a class="btn-link" th:href="@{'/api/log/' + ${log.id} + '/download'}">下载</a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <div class="pager">
                    <span>共 <b th:text="${page.totalElements}">0</b> 条，第
                        <b th:text="${page.number + 1}">1</b> /
                        <b th:text="${page.totalPages == 0 ? 1 : page.totalPages}">1</b> 页</span>
                    <span class="spacer"></span>
                    <a class="btn btn-sm" th:if="${page.number > 0}"
                       th:href="@{/log/list(page=${page.number}, size=${page.size}, taskCode=${taskCode}, taskName=${taskName}, status=${status}, triggerType=${triggerType}, keyword=${keyword}, startTime=${startTime}, endTime=${endTime})}">上一页</a>
                    <a class="btn btn-sm" th:if="${page.number + 1 < page.totalPages}"
                       th:href="@{/log/list(page=${page.number + 2}, size=${page.size}, taskCode=${taskCode}, taskName=${taskName}, status=${status}, triggerType=${triggerType}, keyword=${keyword}, startTime=${startTime}, endTime=${endTime})}">下一页</a>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: modal}"></div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
