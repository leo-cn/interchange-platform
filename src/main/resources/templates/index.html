<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: commonHead('运行看板')}"></head>
<body>
<div class="layout">
    <div th:replace="~{fragments/layout :: sidebar('index')}"></div>

    <div class="main">
        <div th:replace="~{fragments/layout :: topbar('运行看板')}"></div>

        <div class="content">
            <!-- 统计卡片 -->
            <div class="grid grid-4">
                <div class="card stat">
                    <div class="label">定时任务</div>
                    <div class="value">
                        <span th:text="${stats.taskEnabled}">0</span>
                        <span class="text-sub" style="font-size:14px;font-weight:400;">
                            / <span th:text="${stats.taskTotal}">0</span> 启用
                        </span>
                    </div>
                    <div class="foot">
                        <a th:href="@{/task/list}">查看任务列表 →</a>
                    </div>
                </div>
                <div class="card stat">
                    <div class="label" th:text="${stats.keepLatestOnly} ? '推送任务（最后一次执行）' : '今日推送次数'">
                        推送任务（最后一次执行）
                    </div>
                    <div class="value" th:text="${stats.pushTotal}">0</div>
                    <div class="foot">
                        成功 <span th:text="${stats.pushSuccess}">0</span> ·
                        失败 <span th:text="${stats.pushFail}">0</span> ·
                        部分成功 <span th:text="${stats.pushPartial}">0</span>
                    </div>
                </div>
                <div class="card stat">
                    <div class="label" th:text="${stats.keepLatestOnly} ? '最后执行成功率' : '今日成功率'">最后执行成功率</div>
                    <div class="value" th:text="${stats.pushSuccessRate}">-</div>
                    <div class="foot">最长单次耗时 <span th:text="${stats.pushMaxCost}">0</span> ms</div>
                </div>
                <div class="card stat">
                    <div class="label" th:text="${stats.keepLatestOnly} ? '接收接口（最后一次调用）' : '今日接收请求'">
                        接收接口（最后一次调用）
                    </div>
                    <div class="value" th:text="${stats.receiveTotal}">0</div>
                    <div class="foot">
                        失败 <span th:text="${stats.receiveFail}">0</span> ·
                        <a th:href="@{/receive/list}">接收日志 →</a>
                    </div>
                </div>
            </div>

            <!-- 调度概览 -->
            <div class="card">
                <div class="card-head">
                    <span>调度概览（启用中的任务）</span>
                    <div class="actions">
                        <a class="btn btn-sm" th:href="@{/log/list}">执行日志</a>
                        <a class="btn btn-sm btn-primary" th:href="@{/task/edit}">新建任务</a>
                    </div>
                </div>
                <div class="card-body tight">
                    <table>
                        <thead>
                        <tr>
                            <th>任务编码</th>
                            <th>任务名称</th>
                            <th>Cron</th>
                            <th>下次执行</th>
                            <th>最近执行</th>
                            <th>最近结果</th>
                            <th class="nowrap">操作</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${#lists.isEmpty(enabledTasks)}">
                            <td colspan="7" class="empty">暂无启用中的任务</td>
                        </tr>
                        <tr th:each="task : ${enabledTasks}">
                            <td class="mono" th:text="${task.taskCode}">CODE</td>
                            <td th:text="${task.taskName}">名称</td>
                            <td class="mono" th:text="${task.cronExpression}">cron</td>
                            <td class="mono" th:text="${nextFireMap.get(task.taskCode)}">-</td>
                            <td class="mono"
                                th:text="${task.lastExecTime == null ? '-' : #temporals.format(task.lastExecTime, 'MM-dd HH:mm:ss')}">-</td>
                            <td>
                                <span th:if="${task.lastResult == 'SUCCESS'}" class="badge badge-success">成功</span>
                                <span th:if="${task.lastResult == 'FAIL'}" class="badge badge-fail">失败</span>
                                <span th:if="${task.lastResult == 'PARTIAL'}" class="badge badge-partial">部分成功</span>
                                <span th:if="${task.lastResult == null}" class="badge badge-gray">未执行</span>
                            </td>
                            <td class="nowrap">
                                <button class="btn-link" type="button" th:attr="onclick=|runTask(${task.id})|">立即执行</button>
                                <a class="btn-link" th:href="@{/task/edit(id=${task.id})}">配置</a>
                                <a class="btn-link" th:href="@{/log/list(taskCode=${task.taskCode})}">日志</a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- 最近执行 -->
            <div class="card">
                <div class="card-head">
                    <span th:text="${stats.keepLatestOnly} ? '各任务最后一次执行' : '最近 20 次执行'">各任务最后一次执行</span>
                    <div class="actions"><a class="btn btn-sm" th:href="@{/log/list}">全部日志</a></div>
                </div>
                <div class="card-body tight">
                    <table>
                        <thead>
                        <tr>
                            <th>时间</th>
                            <th>任务</th>
                            <th>第三方</th>
                            <th>触发</th>
                            <th>结果</th>
                            <th>条数</th>
                            <th>耗时</th>
                            <th class="nowrap">操作</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${#lists.isEmpty(recentLogs)}">
                            <td colspan="8" class="empty">暂无执行记录</td>
                        </tr>
                        <tr th:each="log : ${recentLogs}">
                            <td class="mono"
                                th:text="${log.startTime == null ? '-' : #temporals.format(log.startTime, 'MM-dd HH:mm:ss')}">-</td>
                            <td th:text="${log.taskName}">任务</td>
                            <td th:text="${log.partnerName}">第三方</td>
                            <td>
                                <span class="badge badge-gray"
                                      th:text="${log.triggerType == 'MANUAL' ? '手工' : '定时'}">定时</span>
                            </td>
                            <td>
                                <span th:if="${log.status == 'SUCCESS'}" class="badge badge-success">成功</span>
                                <span th:if="${log.status == 'FAIL'}" class="badge badge-fail">失败</span>
                                <span th:if="${log.status == 'PARTIAL'}" class="badge badge-partial">部分成功</span>
                            </td>
                            <td th:text="${log.totalCount}">0</td>
                            <td th:text="${log.costMs + ' ms'}">0</td>
                            <td class="nowrap">
                                <button class="btn-link" type="button" th:attr="onclick=|showTaskLogDetail(${log.id})|">详情</button>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: modal}"></div>
<script th:src="@{/js/app.js}"></script>
<script>
    async function runTask(id) {
        if (!confirm('确认立即执行该任务？执行结果请到执行日志页查看。')) {
            return;
        }
        const r = await postForm('/api/task/run', {id: id});
        toast(r.message, r.code === 0 ? 'success' : 'error');
    }
</script>
</body>
</html>
