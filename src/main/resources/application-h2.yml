# ==========================================================================
#  H2 内嵌数据库（默认 Profile，零安装，开箱即跑）
#  数据文件落在 ./data/interchange.mv.db
# ==========================================================================
spring:
  datasource:
    # 注意：H2 2.x 不支持 AUTO_SERVER=TRUE 与 DB_CLOSE_ON_EXIT=FALSE 同时出现
    url: ${DB_URL:jdbc:h2:file:./data/interchange;AUTO_SERVER=TRUE}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    hikari:
      pool-name: interchange-pool
      maximum-pool-size: 10
      minimum-idle: 2
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false
