# ==========================================================================
#  MySQL 8.x（默认 Profile）
#  库名：t6（连接串带 createDatabaseIfNotExist=true，库不存在会自动创建，
#        5 张表由 ddl-auto=update 自动建在该库下）
#  启动方式：默认即为 mysql；切换其他库用 --spring.profiles.active=oracle|postgresql|h2
#  建表脚本： db/schema-mysql.sql （可选，生产环境建议手工执行并改用 ddl-auto=validate）
# ==========================================================================
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/t6?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:123}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
    hikari:
      pool-name: interchange-pool
      maximum-pool-size: 15
      minimum-idle: 3
      connection-test-query: SELECT 1
  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai
