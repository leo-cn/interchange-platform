# ==========================================================================
#  PostgreSQL 12+
#  启动方式： --spring.profiles.active=postgresql   或   DB_TYPE=postgresql
#  建表脚本： db/schema-postgresql.sql
#  注意：需要先建库  CREATE DATABASE interchange;
# ==========================================================================
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/interchange}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
    hikari:
      pool-name: interchange-pool
      maximum-pool-size: 15
      minimum-idle: 3
      connection-test-query: SELECT 1
  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai
